<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园学习与数据整合</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md bg-white mb-4">
    <div class="container">
      <a class="navbar-brand" href="#tasks">校园学习站</a>
      <div class="navbar-nav">
        <a class="nav-link active" href="#tasks">任务清单</a>
        <a class="nav-link" href="#dashboard">借阅看板</a>
        <a class="nav-link" href="#scene">校园一角</a>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    <header class="mb-4">
      <h1 class="h3 mb-1">校园学习与数据整合</h1>
      <p class="text-muted mb-0">任务清单 + 图书馆借阅看板 + 校园一角三维场景</p>
    </header>

    <section id="tasks" class="mb-5">
      <div class="card">
        <div class="card-body">
          <h2 class="h4">任务清单</h2>
          <form id="add-form" class="row g-2 align-items-center mb-2">
            <div class="col-sm">
              <label class="visually-hidden" for="task-input">任务内容</label>
              <input type="text" id="task-input" class="form-control" placeholder="要做什么？">
            </div>
            <div class="col-sm-auto">
              <button type="submit" class="btn btn-primary">添加</button>
            </div>
          </form>
          <p class="tip" id="tip" role="status" aria-live="polite"></p>
          <ul id="task-list"></ul>
          <div class="filters">
            <button class="btn btn-sm btn-outline-primary" data-filter="all">全部</button>
            <button class="btn btn-sm btn-outline-primary" data-filter="active">未完成</button>
            <button class="btn btn-sm btn-outline-primary" data-filter="done">已完成</button>
          </div>
        </div>
      </div>
    </section>

    <section id="dashboard" class="mb-5">
      <h2 class="h4">图书馆数据看板</h2>
      <p class="text-muted" id="sub-title">数据来源：课程统一数据集</p>
      <p id="status" class="alert alert-warning"></p>
      <section class="row g-3 mb-4" id="cards"></section>
      <section class="row g-3">
        <div class="col-lg-6">
          <h3 class="h5">各月借阅量（ECharts柱状图）</h3>
          <div id="bar-chart" class="chart-box"></div>
        </div>
        <div class="col-lg-6">
          <h3 class="h5">借阅趋势（Chart.js折线图）</h3>
          <div class="chart-box"><canvas id="line-chart"></canvas></div>
        </div>
      </section>
    </section>

    <section id="scene" class="mb-5">
      <h2 class="h4">校园一角（三维）</h2>
      <div class="scene-box">
        <a-scene embedded>
          <a-sky color="#aee3f7"></a-sky>
          <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#7cb342"></a-plane>

          <a-box position="0 1.2 -6" width="4" height="2.4" depth="2" color="#efeeee"></a-box>
          <a-box position="0 2.7 -6" width="4.4" height="0.4" depth="2.4" color="#b71c1c"></a-box>

          <a-cylinder position="3 1.8 -5" radius="0.05" height="3.6" color="#9e9e9e"></a-cylinder>
          <a-box position="3.35 3.3 -5" width="0.7" height="0.45" depth="0.03" color="#e53935"
                 animation="property: position; to: 3.4 3.3 -5; dir: alternate; dur: 900; loop: true"></a-box>

          <a-cylinder position="-3 1.2 -4" radius="0.06" height="2.4" color="#616161"></a-cylinder>
          <a-sphere position="-3 2.5 -4" radius="0.18" color="#fff59d"
                    animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 1200; loop: true"></a-sphere>
          <a-light type="point" position="-3 2.6 -4" color="#fff59d" intensity="0.6"></a-light>

          <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>

          <a-camera position="0 1.8 2"></a-camera>
        </a-scene>
      </div>
    </section>
  </main>

  <footer class="text-center text-muted py-4">
    任务数据保存在浏览器本地；借阅数据来自 data/data.json；三维场景来自课堂作业七。
  </footer>

  <script src="libs/aframe.min.js"></script>
  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
